name: Deploy

# Runs after CI finishes on main (i.e. after a merge) and, on success, applies
# pending Prisma migrations and deploys every Fly.io service.
# Reads FLY_API_TOKEN from the `Production` environment. The token must be
# org-scoped: the migration step uses `fly ssh`, which a per-app deploy token
# cannot do.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling, so a
# deploy already talking to Fly is not killed halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    # Gate on a green CI run; manual dispatch bypasses it on purpose.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # FLY_API_TOKEN lives in this environment, not in the repository secrets.
    environment: Production
    timeout-minutes: 15

    steps:
      # Deploy the exact commit CI validated, not whatever main points at now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Apply pending Prisma migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash infra/fly/run-prod-migrate.sh

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30

    strategy:
      # One broken service must not cancel the other four mid-deploy.
      fail-fast: false
      matrix:
        service: [payments, notifications, workflows, portfolios, gateway]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # deploy.sh parses `fly machines list --json` with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.service }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash infra/fly/deploy.sh ${{ matrix.service }}
